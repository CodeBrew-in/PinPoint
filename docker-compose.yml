services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://pinpoint:pinpoint@postgres:5432/pinpoint
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pinpoint
      POSTGRES_PASSWORD: pinpoint
      POSTGRES_DB: pinpoint
    ports:
      - "5432:5432"