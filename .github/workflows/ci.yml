name: CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "ci/**"
      - "docs/**"
      - "security/**"
      - "deploy/**"

  pull_request:
    branches:
      - develop
      - main

# A newer push to the same branch cancels the older, now pointless, run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the comment shows the version) so a moved tag cannot change what runs.
jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-redesign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-redesign/package-lock.json

      - run: npm ci
      - run: npm run lint
      # "npm run build" runs "tsc -b" (the real typecheck) and then the Vite build.
      # VITE_API_URL is set as in the production image, so this is the build that ships.
      - run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (tests and coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pinpoint
          POSTGRES_PASSWORD: pinpoint
          POSTGRES_DB: pinpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinpoint -d pinpoint"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pinpoint:pinpoint@localhost:5432/pinpoint
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pip-audit

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Dependency audit (warning only)
        run: pip-audit -r requirements.txt || true

      # A typo in render.yaml would only show up at deploy time, so check it here
      - name: render.yaml is valid and complete
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml
          doc = yaml.safe_load(open("../render.yaml", encoding="utf-8"))
          services = {s["name"]: s for s in doc["services"]}
          assert len(services) == 2, "expected the backend and the static site"
          api = next(s for s in services.values() if s["runtime"] == "docker")
          web = next(s for s in services.values() if s["runtime"] == "static")
          keys = {e["key"] for e in api["envVars"]}
          for needed in ("DATABASE_URL", "SECRET_KEY", "MEDIA_BACKEND", "APP_ENV", "FRONTEND_ORIGINS"):
              assert needed in keys, f"backend is missing {needed}"
          assert any(e["key"] == "VITE_API_URL" for e in web["envVars"]), "the site needs VITE_API_URL"
          assert api["healthCheckPath"] == "/api/v1/health"
          print("render.yaml ok")
          PY

  docker:
    name: Docker (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Starts the real stack, signs up, logs in and calls /auth/me
      - name: Smoke test the full stack
        run: bash scripts/smoke-test.sh

      # The images the Release workflow publishes must keep building
      - name: Build production images
        run: |
          docker build -f frontend-redesign/Dockerfile.prod -t pinpoint-web-prod frontend-redesign
          docker build -f backend/Dockerfile -t pinpoint-backend-prod backend

      - name: Check the production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p pinpoint-smoke logs --no-color --tail=100

  # One required check for branch protection: passes only when every job above passed
  ci-ok:
    name: CI passed
    if: always()
    needs: [frontend, backend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "frontend=${{ needs.frontend.result }} backend=${{ needs.backend.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.docker.result }}" = "success"
