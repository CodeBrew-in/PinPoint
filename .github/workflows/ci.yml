name: CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "ci/**"
      - "docs/**"

  pull_request:
    branches:
      - develop
      - main

# A newer push to the same branch cancels the older, now pointless, run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # "npm run build" runs "tsc -b" (the real typecheck) and then the Vite build
      - run: npm run build

      - name: Dependency audit (warning only)
        run: npm audit --audit-level=high || true

  backend:
    name: Backend (tests and coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pinpoint
          POSTGRES_PASSWORD: pinpoint
          POSTGRES_DB: pinpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinpoint -d pinpoint"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pinpoint:pinpoint@localhost:5432/pinpoint
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pip-audit

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Dependency audit (warning only)
        run: pip-audit -r requirements.txt || true

  docker:
    name: Docker (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Starts the real stack, signs up, logs in and calls /auth/me
      - name: Smoke test the full stack
        run: bash scripts/smoke-test.sh

      # The images the Release workflow publishes must keep building
      - name: Build production images
        run: |
          docker build -f frontend/Dockerfile.prod -t pinpoint-frontend-prod frontend
          docker build -f backend/Dockerfile -t pinpoint-backend-prod backend

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

  # One required check for branch protection: passes only when every job above passed
  ci-ok:
    name: CI passed
    if: always()
    needs: [frontend, backend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "frontend=${{ needs.frontend.result }} backend=${{ needs.backend.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.docker.result }}" = "success"
