# Weekly pull requests that bump out-of-date dependencies, so security fixes arrive on their own
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  # frontend-redesign is the frontend that ships; the old frontend/ is not watched any more
  - package-ecosystem: npm
    directory: /frontend-redesign
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a few days after a release before proposing it, so a hijacked package version is usually caught first
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend-redesign
    target-branch: develop
    schedule:
      interval: weekly
