# Serves the built app and forwards the API. Runs as a non-root user on port 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Photo uploads are limited to 5 MB by the API; reject bigger bodies before they reach it
  client_max_body_size 6m;

  # Security headers for every response from this server
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  # Map tiles come from OpenStreetMap and fonts from Google Fonts; nothing else is loaded from outside
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # nginx adds these itself (above), so drop the backend's copies instead of sending each twice
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  location /media/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # nginx adds these itself (above), so drop the backend's copies instead of sending each twice
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  # Built files have content hashes in their names, so they can be cached for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Single page app: any other URL (for example /maps/3) serves index.html and the router takes over
  location / {
    try_files $uri /index.html;
  }
}
